# Configuración maestra — Plataforma de herramientas internas del LIS (UTN FRC)

[camara]
indice = 0
url_stream = ""
backend = "auto" # "auto", "dshow" (Windows), "v4l2" (Linux)
espejo = true
mostrar_ventana_local = true

[modelos]
detector_caras = "blaze_face_short_range.tflite"
reconocedor_manos = "manos/gesture_recognizer.task"
landmarks_caras = "face_landmarker.task"
motor_embeddings = "facenet_rapido"

[archivos]
base_datos_sqlite = "datos/lis_maestra.db"
portero_jsonl = "datos/portero_eventos.jsonl"
frame_compartido = "datos/ultimo_frame.jpg"
caras_csv = "caras/caras.csv"
asistencia_csv = "asistencia/asistencia.csv"
ingresos_csv = "manos/registro_de_ingresos.csv"

[parametros]
umbral_reconocimiento = 0.80
metodo_comparacion = "minimo" # "minimo" o "promedio"
intervalo_frames_asistencia = 100
registro_permanencia_activo = false # Desactivado por privacidad (Sección 13)
frames_cara_estable = 3
tolerancia_movimiento_px = 45
frames_confirmacion_gesto = 5
muestras_alta = 5
cooldown_gesto_segundos = 4.0
pin_admin = "1234"
token_dispositivo = "lis-local-token-2026"
puerto_portero = 8080
proyecto = "LIS"
